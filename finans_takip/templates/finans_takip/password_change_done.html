{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="page-dashboard">

  <div class="header-row">
    <div class="greeting">
      <h2 style="color:#16277c; margin-bottom:6px;">Şifre Güncellendi</h2>
      <small style="color: rgba(20, 35, 90, 0.70);">Şifren başarıyla değiştirildi</small>
    </div>
  </div>

  <div style="max-width: 720px; margin-top: 16px;">
    <div style="
      background: rgba(255,255,255,0.92);
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 10px 30px rgba(18, 31, 77, 0.08);
      border: 1px solid rgba(0,0,0,0.05);
    ">
      <div style="font-weight: 900; color:#0f1f60; font-size: 15px;">
        Harika! Şifren güncellendi ✅
      </div>
      <div style="margin-top: 8px; color: rgba(20, 35, 90, 0.70); font-size: 13px;">
        Güvenlik için yeni şifreni kimseyle paylaşma.
      </div>

      <div style="display:flex; gap:10px; justify-content:flex-end; margin-top: 14px;">
        <a href="{% url 'ayarlar' %}" style="
          background: #1e3c72;
          color: #fff;
          padding: 10px 14px;
          border-radius: 12px;
          text-decoration: none;
          font-weight: 900;
          font-size: 13px;
          min-width: 180px;
          text-align:center;
        ">Ayarlar'a Dön</a>
      </div>
    </div>
  </div>

</div>
{% endblock %}
